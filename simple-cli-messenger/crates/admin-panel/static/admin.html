<!doctype html>
<html>
    <head>
        <title>Admin Panel</title>
    </head>
    <body>
        <h1>Admin Panel</h1>

        <h2>Events</h2>
        <div
            id="events"
            style="
                border: 1px solid black;
                padding: 10px;
                height: 200px;
                overflow-y: auto;
                background: #f5f5f5;
            "
        ></div>
        <br></br>

        <button onclick="getUsers()">Get Users</button>
        <br></br>

        <input type="string" id="deleteUserId" placeholder="Username" />
        <button onclick="deleteUser()">Kick</button>
        <pre id="deleteResult"></pre>

        <input type="string" id="messageUserId" placeholder="Username" />
        <input type="text" id="messageText" placeholder="Message" />
        <button onclick="sendMessage()">Send</button>
        <pre id="messageResult"></pre>

        <script>
            const API_URL = "http://localhost:3000";

            async function getUsers() {
                const _ = await fetch(`${API_URL}/users`);
            }

            async function deleteUser() {
                const userId = document.getElementById("deleteUserId").value;
                const response = await fetch(`${API_URL}/users/${userId}`, {
                    method: "DELETE",
                });
                const data = await response.json();
                document.getElementById("deleteResult").textContent =
                    JSON.stringify(data, null, 2);
            }

            async function sendMessage() {
                const userId = document.getElementById("messageUserId").value;
                const message = document.getElementById("messageText").value;
                const response = await fetch(
                    `${API_URL}/users/${userId}?msg=${encodeURIComponent(message)}`,
                    {
                        method: "POST",
                    },
                );
                const data = await response.json();
                document.getElementById("messageResult").textContent =
                    await response.text();
            }

            function handleEvent(msg) {
                const now = new Date().toLocaleTimeString();
                const eventsDiv = document.getElementById("events");
                const line = document.createElement("div");
                line.textContent = `[${now}] ${msg}`;
                eventsDiv.appendChild(line);
                eventsDiv.scrollTop = eventsDiv.scrollHeight;
            }

            const es = new EventSource("/api/events");

            es.onmessage = (e) => {
                handleEvent(e.data);
            };

            es.onerror = () => {
                console.log("SSE disconnected, browser will retry");
            };
        </script>
    </body>
</html>
